---
# ============================================================================
# Generic VM Deployment Variables
# ============================================================================
#
# vars_files:
#   - ../vars/deploy-vm-vars.yml
#
# Required variables:
#
# Proxmox API
# proxmox_api_host: devproxn1.ph-cov.local
# proxmox_api_user: ansible@pve
# proxmox_api_token_id: ansible
# proxmox_api_token_secret: xxxxxxxxxxxxx
#
# Template / Target
# proxmox_node: devproxn2
# template_name: ubuntu24-template
# template_vmid: 9000
#
# VM Configuration
# vmid: 1100
# vm_name: app01
# vm_cores: 4
# vm_memory: 8192
#
# Cloud-Init Networking
# vm_ip: 10.25.4.31/24
# vm_gateway: 10.25.4.1
#
# Disk Resize (optional)
# disk_resize: "+10G"
#
# SSH Access
# ansible_user: pharmaron_bgadmin
# ansible_ssh_private_key_file: ~/.ssh/proxmox_ansible
#
# Inventory
# inventory_hostname: app_vm
# inventory_group: deployed_vms
#
# ============================================================================

    - name: Stop existing VM
      community.proxmox.proxmox_kvm:
        vmid: "{{ vmid }}"
        node: "{{ proxmox_node }}"
        state: stopped
      ignore_errors: true

    - name: Wait for VM shutdown
      ansible.builtin.pause:
        seconds: 15

    - name: Remove existing VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: absent
        purge: true
      ignore_errors: true

    - name: Clone VM from template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        clone: "{{ template_name }}"
        vmid: "{{ template_vmid }}"
        newid: "{{ vmid }}"
        name: "{{ vm_name }}"
        full: true
        timeout: 300
        state: present

    - name: Configure VM resources
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        cores: "{{ vm_cores }}"
        balloon: "{{ vm_memory }}"
        state: present
        autostart: true

    - name: Configure cloud-init networking
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: present
        update: true
        ipconfig:
          ipconfig0: "ip={{ vm_ip }},gw={{ vm_gateway }}"

    - name: Resize primary disk
      community.proxmox.proxmox_disk:
        vmid: "{{ vmid }}"
        disk: scsi0
        size: "{{ disk_resize }}"
        state: resized
      when:
        - disk_resize is defined
        - disk_resize | length > 0

    - name: Start VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: started

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ vm_ip.split('/')[0] }}"
        port: 22
        timeout: 300

    - name: Add VM to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: "{{ inventory_group }}"
        ansible_host: "{{ vm_ip.split('/')[0] }}"
        ansible_user: "ansible"
