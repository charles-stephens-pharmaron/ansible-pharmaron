    - name: Stop existing VM
      community.proxmox.proxmox_kvm:
        vmid: "{{ vmid }}"
        node: "{{ proxmox_node }}"
        state: stopped
      ignore_errors: true

    - name: Wait for VM shutdown
      ansible.builtin.pause:
        seconds: 15

    - name: Remove existing VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: absent
        purge: true
      ignore_errors: true

    - name: Clone VM from template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        clone: "{{ template_name }}"
        vmid: "{{ template_vmid }}"
        newid: "{{ vmid }}"
        name: "{{ vm_name }}"
        full: true
        timeout: 300
        state: present

    - name: Configure VM resources
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        cores: "{{ vm_cores }}"
        balloon: "{{ vm_memory }}"
        description: "{{ vm_description }}"
        state: present
        autostart: true
    
    - name: Add storage network adapter
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: present
        update: true
        update_unsafe: true
        net:
          net1: "virtio,bridge=LANOut,tag=7"

    - name: Configure cloud-init networking
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: present
        update: true
        ipconfig:
          ipconfig0: "ip={{ vm_ip }},gw={{ vm_gateway }}"
          ipconfig1: "ip={{ storage_ip }}"
        nameservers:
        - "{{ vm_dns }}"
        searchdomains:
        - "{{ vm_searchdomain }}"

    - name: Resize primary disk
      community.proxmox.proxmox_disk:
        vmid: "{{ vmid }}"
        disk: scsi0
        size: "{{ disk_resize }}"
        state: resized
      when:
        - disk_resize is defined
        - disk_resize | length > 0

    - name: Start VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: started

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ vm_ip.split('/')[0] }}"
        port: 22
        timeout: 300

    - name: Add VM to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: "{{ inventory_group }}"
        ansible_host: "{{ vm_ip.split('/')[0] }}"
        ansible_user: "ansible"
