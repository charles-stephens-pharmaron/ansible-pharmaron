---
- name: Deploy Zabbix VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/deploy-zabbix-vars.yml

  tasks:

    - name: Remove existing VM
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: absent
        purge: true
      ignore_errors: true

    - name: Clone Zabbix VM from template
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        clone: "{{ template_name }}"
        vmid: "{{ vmid }}"
        name: "{{ vm_name }}"
        full: true
        timeout: 300
        state: present

    - name: Configure VM resources
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        cores: "{{ vm_cores }}"
        memory: "{{ vm_memory }}"
        state: present

    - name: Configure cloud-init networking
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        ipconfig:
          ipconfig0: "ip={{ vm_ip }},gw={{ vm_gateway }}"
        state: present

    - name: Resize disk
      community.proxmox.proxmox_disk:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        disk: scsi0
        size: "+5G"
        state: resized

    - name: Start VM
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vmid }}"
        state: started

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ vm_ip.split('/')[0] }}"
        port: 22
        timeout: 300

    - name: Add Zabbix VM to inventory
      ansible.builtin.add_host:
        name: zabbix_vm
        groups: zabbix_build
        ansible_host: "{{ vm_ip.split('/')[0] }}"
        ansible_user: pharmaron_bgadmin
        ansible_ssh_private_key_file: ~/.ssh/proxmox_ansible