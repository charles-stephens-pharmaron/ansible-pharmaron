# Requires BWS_ACCESS_TOKEN environment variable
# Example:
# source ./bws.env
# before running ansible-playbook
# bws_access_token: "{{ lookup('ansible.builtin.env', 'bws_access_token') }}"

ubuntu_version: noble
ubuntu_image_file: "{{ ubuntu_version }}-server-cloudimg-amd64.img"
ubuntu_image_url: "https://cloud-images.ubuntu.com/{{ ubuntu_version }}/current/{{ ubuntu_image_file }}"
image_directory: /home/ansible/images

template_vmid: 9000
template_name: ubuntu-2404-template
template_memory: 4096
template_cores: 4
template_bridge: LANOut
template_vlan: 4
template_storage: devprox_disks
# for disk size the format is add size with the unit capitalized - +xxG
template_disk_size: +2G

template_ip: 10.25.4.31/24
template_gateway: 10.25.4.1
template_user: ansible
template_ssh_key: /home/ansible/.ssh/proxmox_ansible.pub
template_timezone: America/New_York

